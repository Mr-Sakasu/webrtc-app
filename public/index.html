<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Test</title>

    <style>
        video {
            width: 45%;
            background-color: black;
        }

        #chatMessages {
            max-width: 40rem;
            height: 10rem;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 0.5rem 0.5rem 0.5rem 2rem;
        }
    </style>
</head>

<body>
    <h1>WebRTC P2P Test</h1>

    <p>左：自分の映像 ／ 右：相手の映像</p>

    <!-- mutedにより、自分の音声が自分のスピーカーから流れるのを防ぐ -->
    <video id="localVideo" autoplay muted playsinline></video>

    <!-- 相手の映像を表示する -->
    <video id="remoteVideo" autoplay playsinline></video>

    <div>
        <button id="startScreenButton">
            画面共有を開始
        </button>

        <button id="stopScreenButton" disabled>
            画面共有を終了
        </button>
    </div>

    <section aria-labelledby="chatHeading">
        <h2 id="chatHeading">チャット</h2>
        <!-- 受信したメッセージは JavaScript でここに追加する -->
        <ul id="chatMessages" aria-live="polite"></ul>
        <form id="chatForm">
            <label for="chatInput">メッセージ</label>
            <input id="chatInput" type="text" maxlength="500" autocomplete="off" disabled>
            <button id="sendChatButton" type="submit" disabled>送信</button>
        </form>
    </section>

    <!-- サーバーから提供されるSocket.IOのクライアントライブラリ -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- 自分で記述するJavaScript -->
    <script type="module" src="/js/main.js"></script>
</body>

</html>
