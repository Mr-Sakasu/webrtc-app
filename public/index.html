<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Roomly | ビデオルーム</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/vendor/texmath/css/texmath.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="/" aria-label="Roomly ホーム">
                <span class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span><span></span>
                </span>
                <span>roomly<span class="brand-dot">.</span></span>
            </a>
            <div class="header-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="roomStatus" role="status" aria-live="polite">ルームに接続中...</span>
            </div>
        </header>

        <main class="workspace">
            <section class="meeting-panel" aria-labelledby="meetingHeading">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">VIDEO ROOM</p>
                        <h1 id="meetingHeading">みんなのルーム</h1>
                        <p class="section-description">同じページを開いた人と映像・チャットを共有できます。</p>
                    </div>
                    <div class="participant-badge" aria-label="参加人数">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H5.4A3.4 3.4 0 0 0 2 18.4V20m17.2-4.9a3.4 3.4 0 0 1 2.8 3.3V20M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8-6.8a3.5 3.5 0 0 1 0 6.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span><strong id="participantCount">1 / 6 人</strong>が参加中</span>
                    </div>
                </div>

                <!-- JavaScript が参加者ごとの .video-card をここへ追加します。 -->
                <div id="videoGrid" class="video-grid">
                    <article class="video-card local-card camera-off" aria-label="自分の映像">
                        <!-- muted により、自分の音声がスピーカーから再生されるのを防ぎます。 -->
                        <video id="localVideo" autoplay muted playsinline></video>
                        <div class="video-placeholder" aria-hidden="true">
                            <span class="placeholder-avatar">あ</span>
                            <span>カメラはオフ</span>
                        </div>
                        <div class="video-footer">
                            <span class="peer-name">あなた <span class="self-label">自分</span></span>
                            <span class="mic-state">マイクオフ</span>
                            <span class="peer-state">接続中</span>
                        </div>
                    </article>
                </div>

                <!-- カメラとマイクは初期状態でオフ。画面共有は1人でも開始できます。 -->
                <div class="meeting-controls" aria-label="通話の操作">
                    <div class="control-copy">
                        <span class="control-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8m-4-4v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        </span>
                        <div><strong>通話コントロール</strong><span>カメラ・マイク・画面共有</span></div>
                    </div>
                    <div class="control-buttons">
                        <button id="cameraButton" class="button button-device" type="button" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="m16 10 5-3v10l-5-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span class="button-label">カメラをオン</span>
                        </button>
                        <button id="micButton" class="button button-device" type="button" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                            <span class="button-label">マイクをオン</span>
                        </button>
                        <button id="startScreenButton" class="button button-primary" type="button">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            共有を開始
                        </button>
                        <button id="stopScreenButton" class="button button-secondary" type="button" disabled>
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
                            共有を終了
                        </button>
                    </div>
                </div>
            </section>

            <aside class="chat-panel" aria-labelledby="chatHeading">
                <div class="chat-header">
                    <div>
                        <p class="eyebrow">CONVERSATION</p>
                        <h2 id="chatHeading">チャット</h2>
                    </div>
                    <span class="chat-live" aria-label="リアルタイムチャット"><span></span>ライブ</span>
                </div>
                <!-- 受信したメッセージは JavaScript がリストに追加します。 -->
                <ul id="chatMessages" class="chat-messages" aria-live="polite" aria-label="チャットのメッセージ"></ul>
                <div class="chat-composer">
                    <form id="chatForm">
                        <label class="sr-only" for="chatInput">メッセージ</label>
                        <textarea id="chatInput" rows="3" maxlength="2000" placeholder="メッセージを入力..." disabled></textarea>
                        <div class="composer-footer">
                            <span>Enter で送信 · Shift + Enter で改行</span>
                            <button id="sendChatButton" class="send-button" type="submit" disabled aria-label="メッセージを送信">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 12 16-8-4 16-4-6-8-2Zm8 2 8-10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </form>
                    <p class="format-help">Markdown 対応 · 数式は <code>$x^2$</code> または <code>$$x^2$$</code></p>
                </div>
            </aside>
        </main>
    </div>

    <!-- 描画ライブラリを先に読み込み、最後にアプリを起動します。 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/markdown-it/markdown-it.umd.min.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/texmath/texmath.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
